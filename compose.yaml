services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zwitscher-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL}"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zwitscher-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5176
      ConnectionStrings__PostgresConnection: "${DB_CONN}"
      JwtConfig__Secret: "${JWT_SECRET}"
    ports:
      - "5176:5176"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zwitscher
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: zwitscher
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
